<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14263F"/>
      <stop offset="0.6" stop-color="#1F4F86"/>
      <stop offset="1" stop-color="#23856F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#BFE3FF" stop-opacity="0.75"/>
      <stop offset="0.6" stop-color="#7FB8E8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7FB8E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8AE85"/>
      <stop offset="0.55" stop-color="#D99A70"/>
      <stop offset="1" stop-color="#B9774F"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E5A97F"/>
      <stop offset="1" stop-color="#C4835B"/>
    </linearGradient>
    <linearGradient id="shorts" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2B323C"/>
      <stop offset="1" stop-color="#171C23"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A3029"/>
      <stop offset="1" stop-color="#17120F"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="430" r="440" fill="url(#glow)"/>
  <g fill="url(#leaf)">
    <path d="M64,330 C70,200 160,110 290,96 C280,226 190,318 64,330 Z"/>
    <path d="M78,316 C130,240 200,170 282,104" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="6" fill="none"/>
    <path d="M964,720 C956,840 878,924 760,938 C770,820 850,732 964,720 Z"/>
    <path d="M952,732 C900,800 840,870 768,930" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="5" fill="none"/>
  </g>

  <g id="leftArm">
    <!-- upper arm (horizontal) with biceps -->
    <path d="M360,372 C300,360 238,368 196,384 C182,404 184,438 200,452 C250,450 302,442 352,436 Z" fill="url(#skin)"/>
    <ellipse cx="268" cy="382" rx="52" ry="30" fill="#E8AE85"/>
    <!-- forearm up -->
    <path d="M200,452 C182,410 180,330 196,262 L246,264 C244,328 246,396 250,444 Z" fill="url(#arm)"/>
    <circle cx="221" cy="250" r="32" fill="#D99A70"/>
    <path d="M200,236 C212,226 232,226 242,236" stroke="#B9774F" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
  <use href="#leftArm" transform="translate(1024,0) scale(-1,1)"/>

  <!-- neck and traps -->
  <path d="M478,292 L546,292 L552,350 L472,350 Z" fill="#D2926A"/>
  <path d="M420,360 C450,334 486,330 512,330 C538,330 574,334 604,360 Z" fill="#C98A62"/>

  <!-- back: V-taper -->
  <path d="M340,372 C372,350 448,338 512,338 C576,338 652,350 684,372 C694,440 660,520 612,580 C592,606 578,640 574,690 L450,690 C446,640 432,606 412,580 C364,520 330,440 340,372 Z" fill="url(#skin)"/>
  <!-- tank top -->
  <path d="M468,346 L556,346 C566,420 592,500 586,580 C580,620 576,650 576,690 L448,690 C448,650 444,620 438,580 C432,500 458,420 468,346 Z" fill="#1E2730"/>
  <path d="M468,346 C462,420 446,500 440,580 M556,346 C562,420 578,500 584,580" stroke="#2E6BB0" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- muscle lines on exposed back -->
  <path d="M392,420 C404,470 420,520 440,560" stroke="#B9774F" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M632,420 C620,470 604,520 584,560" stroke="#B9774F" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- shorts -->
  <path d="M446,684 C490,696 534,696 578,684 C600,740 612,820 606,900 L522,912 L512,820 L502,912 L418,900 C412,820 424,740 446,684 Z" fill="url(#shorts)"/>
  <path d="M448,696 C490,708 534,708 576,696" stroke="#2E6BB0" stroke-width="8" fill="none"/>
  <!-- legs -->
  <path d="M424,900 L500,912 C498,950 494,990 490,1024 L432,1024 C428,990 424,950 424,900 Z" fill="url(#arm)"/>
  <path d="M524,912 L600,900 C600,950 596,990 592,1024 L534,1024 C530,990 526,950 524,912 Z" fill="url(#arm)"/>

  <!-- head (from behind, short hair) -->
  <circle cx="512" cy="236" r="64" fill="url(#skin)"/>
  <path d="M449,240 C445,184 476,168 512,168 C548,168 579,184 575,240 C573,262 563,278 550,286 C532,292 492,292 474,286 C461,278 451,262 449,240 Z" fill="url(#hair)"/>
  <path d="M476,284 C494,290 530,290 548,284" stroke="#6B5444" stroke-width="4" fill="none" opacity="0.6"/>
  <path d="M478,190 C496,182 528,182 546,190" stroke="#5A4638" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <ellipse cx="447" cy="242" rx="11" ry="17" fill="#D2926A"/>
  <ellipse cx="577" cy="242" rx="11" ry="17" fill="#D2926A"/>
</svg>
