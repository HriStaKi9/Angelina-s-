<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D94A68"/>
      <stop offset="0.55" stop-color="#E9707A"/>
      <stop offset="1" stop-color="#F4A36B"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE9D6" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#FFD2B8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFD2B8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0BC93"/>
      <stop offset="0.55" stop-color="#E3A47B"/>
      <stop offset="1" stop-color="#C98760"/>
    </linearGradient>
    <linearGradient id="skinArm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E9AE85"/>
      <stop offset="1" stop-color="#C88560"/>
    </linearGradient>
    <linearGradient id="leggings" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B3344"/>
      <stop offset="0.5" stop-color="#2A2431"/>
      <stop offset="1" stop-color="#1C1720"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6A5F78" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#6A5F78" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A2F3B"/>
      <stop offset="1" stop-color="#16111A"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="560" cy="420" r="430" fill="url(#sun)"/>

  <!-- brand leaves -->
  <g fill="url(#leaf)">
    <path d="M64,330 C70,200 160,110 290,96 C280,226 190,318 64,330 Z"/>
    <path d="M78,316 C130,240 200,170 282,104" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="6" fill="none"/>
    <path d="M964,700 C956,820 878,904 760,918 C770,800 850,712 964,700 Z"/>
    <path d="M952,712 C900,780 840,850 768,910" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="5" fill="none"/>
  </g>

  <g transform="translate(512,96) scale(1.42) translate(-497,-140)">
    <!-- ponytail -->
    <path d="M500,250 C560,262 612,298 657,320 C684,333 712,352 726,376 C694,366 659,355 617,340 C566,321 528,296 492,272 Z" fill="url(#hair)"/>
    <path d="M520,268 C570,286 615,312 680,342" stroke="#5A4A5C" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>
    <!-- raised arm -->
    <path d="M582,336 C608,382 624,442 632,500 L606,506 C598,452 584,402 566,352 Z" fill="url(#skinArm)"/>
    <path d="M606,506 L632,500 C652,442 664,388 672,332 L648,326 C640,386 626,446 606,506 Z" fill="url(#skinArm)"/>
    <circle cx="661" cy="326" r="18" fill="#E2A47C"/>
    <!-- bracelet -->
    <path d="M644,346 C652,352 664,352 670,346" stroke="#2A2431" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- left arm -->
    <path d="M396,336 C374,384 370,452 383,522 C391,572 404,612 417,642 L440,636 C430,590 421,540 419,500 C416,440 421,382 427,346 Z" fill="url(#skinArm)"/>
    <rect x="404" y="596" width="28" height="20" rx="7" fill="#FFFFFF" transform="rotate(-12 418 606)"/>
    <!-- neck -->
    <path d="M452,262 L500,262 L506,318 L452,318 Z" fill="#D99A72"/>
    <!-- back -->
    <path d="M400,334 C435,316 556,316 590,334 C600,372 590,420 572,470 C562,500 552,525 549,556 L445,556 C442,525 432,500 420,470 C402,420 391,372 400,334 Z" fill="url(#skin)"/>
    <!-- shoulder blades & spine -->
    <path d="M496,340 C494,380 495,420 497,456" stroke="#B9774F" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.55"/>
    <!-- sports bra -->
    <path d="M432,326 L554,468 M558,326 L436,468" stroke="#231D29" stroke-width="12" stroke-linecap="round"/>
    <path d="M416,460 C456,474 536,474 576,458 L564,514 C526,525 466,525 430,514 Z" fill="#231D29"/>
    <path d="M424,470 C460,482 532,482 568,468" stroke="#4A4252" stroke-width="3" fill="none" opacity="0.8"/>
    <!-- leggings -->
    <path d="M444,548 C480,558 516,558 550,548 C578,578 602,618 601,662 C600,706 586,736 576,772 C566,822 562,870 556,906 L527,906 C523,860 516,802 507,752 C504,736 501,722 497,712 C493,722 490,736 487,752 C478,802 471,860 467,906 L438,906 C432,870 428,822 418,772 C408,736 393,706 393,662 C392,618 416,578 444,548 Z" fill="url(#leggings)"/>
    <path d="M412,612 C404,650 408,700 424,744" stroke="#6A5F78" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.55"/>
    <path d="M446,553 C480,563 516,563 548,553" stroke="#4A4252" stroke-width="5" fill="none"/>
    <!-- head -->
    <circle cx="468" cy="214" r="58" fill="url(#skin)"/>
    <path d="M416,206 C414,150 470,138 506,158 C538,178 540,242 516,268 C498,286 474,276 468,254 C462,232 446,214 416,206 Z" fill="url(#hair)"/>
    <path d="M446,162 C468,150 494,154 512,170" stroke="#6A5868" stroke-width="7" fill="none" stroke-linecap="round"/>
    <circle cx="486" cy="226" r="11" fill="#D99A72"/>
    <circle cx="487" cy="240" r="3.8" fill="#FFFFFF"/>
    <!-- face -->
    <circle cx="428" cy="232" r="9" fill="#F28C8C" opacity="0.45"/>
    <path d="M420,242 C428,254 442,256 452,248" stroke="#8A2F40" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M424,210 C428,206 434,206 437,210" stroke="#231D29" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
